name: LiveTranslate
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LiveTranslate:
    type: application
    platform: iOS
    sources: [LiveTranslate]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        # Overridable from the command line / CI without touching package targets.
        APP_BUNDLE_ID: com.example.livetranslate
        CLAUDE_API_KEY: ""
        GOOGLE_CLIENT_ID: ""
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.placeholder
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: LiveTranslate
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LiveTranslate/Info.plist
      properties:
        CFBundleDisplayName: Live Translate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Ứng dụng cần micro để nghe tiếng Anh và dịch trực tiếp.
        NSSpeechRecognitionUsageDescription: Ứng dụng cần nhận diện giọng nói để chuyển tiếng Anh thành văn bản.
        ClaudeAPIKey: $(CLAUDE_API_KEY)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
